name: Unzip
on:
  workflow_dispatch:
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip file
        run: |
          unzip -o "Lootclient-1.0.2-github-build.zip"
          rm "Lootclient-1.0.2-github-build.zip"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "unzipped" || true
          git push
